<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Fullscreen Quad WebGL Example</title>
        <style>
            body { margin: 0; overflow: hidden; color: #ffffff; background-color: black;}
            canvas { display: block; width: 100vw; height: 100vh; }
            .overlay {
                display: grid;
                position: fixed;
                grid-template-columns: auto auto;
                top: 0;
                left: 0;
                margin: 15px;
                /*width: 100%;*/
                /*height: 100%;*/
                background-color: #00000088;
            }
            .title {
                grid-column-start: 1;
                grid-column-end: 3;
            }
            .fullscreen_popup {
                position: fixed;
                width: 100%;
                height: 100%;
                top: 0;
                left: 0;
                background-color: #00000088;
                display: flex;
                justify-content: center;
                align-items: center;
                font-size: 72px;
                flex-direction: column;
            }
            button {
                border-radius: 8px;
                padding: 16px;
                margin: 8px;
                color: #ffffff;
                background-color: #5b5b5b88;
            }
            .game_overlay {
                position: fixed;
                top: 0;
                left: 0;
                display: flex;
                width: 100%;
                justify-content: right;
                font-size: 30px;
            }
        </style>
        </head>
    <body>
        <canvas id="glcanvas"></canvas>
        <canvas id="smokeCanvas" width="512" height="512"></canvas>
        <div class="overlay">
            <h2 class="title">Räuchermännchen:</h2>
            <label>Typ: </label>
            <select id="raeuchermaennchen_types">
                <option value="bergmann">Bergmann</option>
                <option value="wichtel">Wichtel</option>
            </select>
            <label>Kleidung: </label>
            <input type="color" id="clothing_color_selector" value="#880000">
            <label>Haut: </label>
            <input type="color" id="skin_color_selector" value="#C07F3B">
            <label>Etc: </label>
            <input type="color" id="acsessories_color_selector" value="#803900">
            <h2 class="title">Rauch:</h2>
            <label>Duftrichtung: </label>
            <select id="smoke_types">
                <option value="Tanne">Tanne</option>
                <option value="Weihrauch">Weihrauch</option>
                <option value="Sandelholz">Sandelholz</option>
            </select>
            
            <label>Wind: </label>
            <input type="range" min="-2" max="2" id="wind" step="0.01">
            <label>Wind Variation: </label>
            <input type="range" min="0" max="5" value="0" id="wind_variation" step="0.01">
            <label>Rauch Dichte: </label>
            <input type="range" min="0" max="1" value="0.5" id="smoke_density" step="0.01">
            <h2 class="title">Info:</h2>
            <label id="data" class="title"></label>
            <label class="title">Bilder sind KI generiert</label>
            <button id="play">Spiel spielen</button>
        </div>
        <div class="fullscreen_popup" style="display: none;" id="gameover">
            Game over
            <div class="score_information">score: [score] highscore: [highscore]</div>
            <div>
                <button id="play_again">Nochmal spielen</button>
                <button id="quit">Spiel beenden</button>
            </div>
        </div>
        <div class="score_information game_overlay"></div>
        <div class="fullscreen_popup" style="display: none;" id="tutorial">
            [←]/[A] um nach links zu gehen und [→]/[D] um nach rechts zu gehen. <br>
            Sammele Zuckerstangen und weiche den Schneebällen aus. <br>
            drücke eine beliebige taste um zu starten
        </div>
        <script src="smoke.js"></script>
        <script src="main.js"></script>
    </body>
</html>
